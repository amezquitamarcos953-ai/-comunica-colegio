      rows.push({apellidos:ap.trim(),nombres:no.trim(),gradoId:gid,gradoLabel:map[gid]||("Grado "+gid),padreNombre:iPa!==-1?(cols[iPa]||""):"",padreTel:iTe!==-1?(cols[iTe]||""):"",padreCorreo:iCo!==-1?(cols[iCo]||""):"",anio:"2026"});
    }
    return rows;
  }
  async function parseXLSX(buf){
    try{
      var view=new DataView(buf);var eocd=-1;for(var i=buf.byteLength-22;i>=0;i--){if(view.getUint32(i,true)===0x06054b50){eocd=i;break;}}if(eocd===-1)throw new Error("No ZIP");
      var cdCount=view.getUint16(eocd+10,true),cdOffset=view.getUint32(eocd+16,true);var entries=[],p=cdOffset;
      for(var k=0;k<cdCount;k++){if(view.getUint32(p,true)!==0x02014b50)break;var nl=view.getUint16(p+28,true),el=view.getUint16(p+30,true),cl=view.getUint16(p+32,true),cs=view.getUint32(p+20,true),lo=view.getUint32(p+42,true);var nm="";for(var n=0;n<nl;n++)nm+=String.fromCharCode(view.getUint8(p+46+n));entries.push({name:nm,compSize:cs,localOff:lo});p+=46+nl+el+cl;}
      async function readEntry(e){var lp=e.localOff,nl2=view.getUint16(lp+26,true),el2=view.getUint16(lp+28,true);var st=lp+30+nl2+el2;var comp=new Uint8Array(buf.slice(st,st+e.compSize));try{var ds=new DecompressionStream("deflate-raw");var ab=await new Response(new Blob([comp]).stream().pipeThrough(ds)).arrayBuffer();return new TextDecoder().decode(ab);}catch(err){return new TextDecoder().decode(comp);}}
      var shared=[],sheetXml="";for(var e2 of entries){if(e2.name.indexOf("sharedStrings")!==-1){var tx=await readEntry(e2);var re=/<t[^>]*>([^<]*)<\/t>/g,mm;while((mm=re.exec(tx))!==null)shared.push(mm[1]);}if(e2.name.indexOf("worksheets/sheet1")!==-1)sheetXml=await readEntry(e2);}
      if(!sheetXml)throw new Error("No sheet1");
      var rowsXml=sheetXml.match(/<row[^>]*>.*?<\/row>/gs)||[];var grid=[];
      rowsXml.forEach(function(rx){var cells=rx.match(/<c[^>]*>.*?<\/c>/gs)||[];var rv=[];cells.forEach(function(cx){var ta=(cx.match(/t="([^"]+)"/)||[])[1];var vm=cx.match(/<v>([^<]*)<\/v>/);var im=cx.match(/<is>.*?<t[^>]*>([^<]*)<\/t>/s);if(im)rv.push(im[1]);else if(ta==="s"&&vm)rv.push(shared[parseInt(vm[1])||0]||"");else if(vm)rv.push(vm[1]);else rv.push("");});grid.push(rv);});
      if(grid.length<2)return[];var csv=grid.map(function(r){return r.map(function(c){return '"'+String(c).replace(/"/g,'""')+'"';}).join(",");}).join("\n");return parseCSV(csv);
    }catch(e){return null;}
  }
  function parsePDFText(buf){try{var txt=new TextDecoder("latin1").decode(buf);var lines=txt.split("\n").map(function(l){return l.replace(/[^a-zA-Z0-9áéíóúÁÉÍÓÚñÑ ,;.\-@_]/g,"").trim();}).filter(function(l){return l.length>3;});var csvLines=lines.filter(function(l){return l.indexOf(",")!==-1;});if(csvLines.length>=2)return parseCSV("Apellidos,Nombres,Grado\n"+csvLines.join("\n"));return[];}catch(e){return[];}}
  document.getElementById("lm-file-import").addEventListener("change",async function(ev){
    var file=ev.target.files[0];if(!file)return;var name=file.name.toLowerCase();var rows=[];
    try{
      if(name.endsWith(".csv")||name.endsWith(".txt")){rows=parseCSV(await file.text());}
      else if(name.endsWith(".xlsx")||name.endsWith(".xls")){var r=await parseXLSX(await file.arrayBuffer());if(r===null){alert("No pude leer este Excel. En Excel: Archivo > Guardar como > CSV y sube ese CSV.");ev.target.value="";return;}rows=r;}
      else if(name.endsWith(".pdf")){rows=parsePDFText(await file.arrayBuffer());if(rows.length===0){alert("No pude leer este PDF (puede ser imagen). Pásalo a Excel y guárdalo como CSV.");ev.target.value="";return;}}
      else{alert("Usa Excel (.xlsx), CSV o PDF.");ev.target.value="";return;}
    }catch(e){alert("Error leyendo: "+e.message);ev.target.value="";return;}
    if(!rows||rows.length===0){alert("No encontré alumnos. Primera fila debe ser: Apellidos,Nombres,Grado,Seccion,Padre,Tel Padre,Correo Padre");ev.target.value="";return;}
    rows.sort(function(a,b){var c=a.apellidos.localeCompare(b.apellidos,"es");if(c!==0)return c;return a.nombres.localeCompare(b.nombres,"es");});
    var resumen={};rows.forEach(function(r){resumen[r.gradoId]=(resumen[r.gradoId]||0)+1;});
    var resumenTxt=Object.keys(resumen).sort().map(function(k){return k+": "+resumen[k];}).join(" | ");
    var listaNombres = rows.map(function(r){return r.apellidos+", "+r.nombres+" ("+r.gradoId+")";}).join("\n");
    if(!confirm("Se importarán "+rows.length+" alumnos ordenados por apellido.\n"+resumenTxt+"\n\n"+listaNombres+"\n\n¿Confirmar?")){ev.target.value="";return;}
    try{
      // BLINDAJE ANTI-DUPLICADOS: leer los que YA existen para no repetirlos cuando los profesores usen el sistema
      var existentes = [];
      try{
        var resEx = await miSupabase.from("alumnos").select("*");
        if(resEx && resEx.data) existentes = resEx.data;
      }catch(e){ console.log("No pude leer existentes", e); }
      function clave(a){ return ((a.apellidos||"")+"|"+(a.nombres||"")+"|"+(a.grado_id||a.gradoId||"")).toLowerCase().trim(); }
      var clavesExist = {};
      existentes.forEach(function(e){ clavesExist[clave(e)] = true; });
      var antes = rows.length;
      rows = rows.filter(function(r){ return !clavesExist[clave(r)]; });
      var duplicados = antes - rows.length;
      if(rows.length===0){ 
        // Recargar desde Supabase para que SE VEAN los que ya existen (antes la lista quedaba vacia)
        try{ var r2 = await miSupabase.from("alumnos").select("*"); if(r2 && r2.data){ var mp = r2.data.map(function(a){ return {id:a.id, apellidos:a.apellidos||'', nombres:a.nombres||'', gradoId:a.grado_id||a.gradoId||'1A', gradoLabel:a.grado_label||a.gradoLabel||'', padreNombre:a.padreNombre||a.padre_nombre||'', padreCorreo:a.padreCorreo||a.padre_correo||'', padreTel:a.padreTel||a.padre_tel||'', anio:a.anio||'2026', pagos:a.pagos||{}, promedio:a.promedio||75}; }); M(mp); } }catch(e){}
        alert("Ya todos esos alumnos existen en el sistema ("+antes+"). No se duplicó ninguno. Ya se recargaron y ahora sí se ven en la lista."); ev.target.value=""; return; }
      if(duplicados>0){ alert("Se saltaron "+duplicados+" alumnos porque YA existían. Solo se agregarán "+rows.length+" nuevos. Así no se duplican."); }
      // Igual que Guardar Alumno original: solo apellidos, nombres, grado_id, grado_label. Supabase genera el id solo.
      // Intentar primero con padre, si la tabla no tiene esas columnas, reintentar solo con los 4 campos que SI funcionan.
      var pagosVacio={inscripcion:false,carnet:false,agenda:false,ex1:false,ex2:false,ex3:false,ex4:false,ene:false,feb:false,mar:false,abr:false,may:false,jun:false,jul:false,ago:false,sep:false,oct:false};
      var toInsertFull=rows.map(function(r){return{apellidos:r.apellidos,nombres:r.nombres,grado_id:r.gradoId,grado_label:r.gradoLabel,padre_nombre:r.padreNombre||"",padre_tel:r.padreTel||"",padre_correo:r.padreCorreo||"",pagos:pagosVacio};});
      var toInsertMin=rows.map(function(r){return{apellidos:r.apellidos,nombres:r.nombres,grado_id:r.gradoId,grado_label:r.gradoLabel,pagos:pagosVacio};});
      var ok=false, lastErr="";
      for(var i=0;i<toInsertFull.length;i+=50){
        var chunk=toInsertFull.slice(i,i+50);
        var res=await miSupabase.from("alumnos").insert(chunk);
        if(res&&res.error){
          lastErr=JSON.stringify(res.error);
          // Fallback: solo 4 campos
          var chunkMin=toInsertMin.slice(i,i+50);
          var res2=await miSupabase.from("alumnos").insert(chunkMin);
          if(res2&&res2.error){ throw new Error("Supabase dice: "+JSON.stringify(res2.error)+" | Intento con padre tambien fallo: "+lastErr); }
        }
      }
      try{ var r3 = await miSupabase.from("alumnos").select("*"); if(r3 && r3.data){ var mp3 = r3.data.map(function(a){ return {id:a.id, apellidos:a.apellidos||'', nombres:a.nombres||'', gradoId:a.grado_id||a.gradoId||'1A', gradoLabel:a.grado_label||a.gradoLabel||'', padreNombre:a.padreNombre||a.padre_nombre||'', padreCorreo:a.padreCorreo||a.padre_correo||'', padreTel:a.padreTel||a.padre_tel||'', anio:a.anio||'2026', pagos:a.pagos||{}, promedio:a.promedio||75}; }); M(mp3); } }catch(e){}
      alert("✅ Listo: "+rows.length+" alumnos guardados y ordenados por apellido. Ya se ven en la lista, sin salirte ni pedirte contraseña otra vez.");
    }catch(e){alert("Error en Supabase: "+e.message+"\n\nSolución rápida: en Supabase ve a Authentication > Policies > alumnos y desactiva RLS, o ejecuta: ALTER TABLE alumnos DISABLE ROW LEVEL SECURITY;");}
    ev.target.value="";
  });
})();

<script>
(function(){
  // FIX LOGIN: guardar usuario y contraseña ANTES de entrar, para que si recargas no te saque
  function findLoginInputs(){
    var all = Array.from(document.querySelectorAll('input')).filter(function(i){ return i.offsetParent!==null && i.type!=="file" && i.type!=="checkbox"; });
    return all;
  }
  document.addEventListener("mousedown", function(e){
    var b = e.target && e.target.closest ? e.target.closest("button") : null;
    if(b && b.innerText && (b.innerText.indexOf("Entrar")!==-1 || b.innerText.indexOf("Iniciar")!==-1)){
      var ins = findLoginInputs();
      if(ins.length>=2){
        var user = ins[0].value;
        var passEl = ins.find(function(i){ return i.type==="password"; }) || ins[1];
        var pass = passEl ? passEl.value : "";
        if(user && pass){ try{ localStorage.setItem("lm_user", user); localStorage.setItem("lm_pass", pass); }catch(e){} }
      }
    }
  }, true);
  // Al salir con Cerrar Sesión, borrar guardado
  document.addEventListener("click", function(e){
    var b = e.target && e.target.closest ? e.target.closest("button") : null;
    if(b && b.innerText && b.innerText.indexOf("Cerrar Sesi")!==-1){
      try{ localStorage.removeItem("lm_user"); localStorage.removeItem("lm_pass"); }catch(e){}
    }
  }, true);
  // Auto-entrar si ya habias entrado antes y la pagina se recargo
  function tryAuto(){
    if(document.body.innerText.indexOf("Bienvenido:")!==-1) return;
    var u = null, pw = null;
    try{ u = localStorage.getItem("lm_user"); pw = localStorage.getItem("lm_pass"); }catch(e){}
    if(!u || !pw) return;
    var btns = Array.from(document.querySelectorAll('button'));
    var loginBtn = btns.find(function(b){ return b.innerText && (b.innerText.indexOf("Entrar")!==-1 || b.innerText.indexOf("Iniciar")!==-1); });
    if(!loginBtn) return;
    var ins = findLoginInputs();
    if(ins.length>=2){
      function setVal(el, val){
        var proto = window.HTMLInputElement.prototype;
        var setter = Object.getOwnPropertyDescriptor(proto, "value").set;
        setter.call(el, val);
        el.dispatchEvent(new Event("input", {bubbles:true}));
        el.dispatchEvent(new Event("change", {bubbles:true}));
      }
      setVal(ins[0], u);
      var passEl = ins.find(function(i){ return i.type==="password"; }) || ins[1];
      setVal(passEl, pw);
      setTimeout(function(){ loginBtn.click(); }, 500);
    }
  }
  setTimeout(tryAuto, 800);
  setInterval(function(){ if(document.body.innerText.indexOf("Bienvenido:")===-1) tryAuto(); }, 2000);
})();
</script>
